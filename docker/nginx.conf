server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # App (MoveMove 2.0) — rotas por hash, fallback pro shell do app
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    location = /app {
        return 301 /app/;
    }

    # Landing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API (futuro) — descomente quando subir o backend
    # location /api/ {
    #     proxy_pass http://backend:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Assets com cache longo
    location ~* \.(js|css|wasm|task|png|jpg|svg|ico|woff2|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm;
    gzip_min_length 1024;
}
